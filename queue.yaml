# Research queue requests for the engine (merged by python -m src.research.sync_queue).
# Each item needs a card (hypotheses/H-NNNN.yaml here or in the engine) and an id you choose
# (stable across edits, e.g. R-0001). Rules:
#   - a new id is added to the engine's queue as a pending item;
#   - changing the priority of a still-pending item is applied;
#   - status: skipped on a still-pending item cancels it;
#   - an id naming an engine queue item (Q-000123) reprioritises / cancels that item;
#   - items already running or done are never changed; invalid items are rejected (errors.json).
# Example:
#   items:
#     - id: R-0001
#       card: H-0005
#       params: {window: 126}
#       priority: 3
version: 1
items:
  - id: R-0001
    card: H-0002
    params: {lookback: 252, n_holdings: 25, rebalance_every_weeks: 4}
    priority: 5
    source: researcher
    note: Residual momentum is the only momentum variant never run; 4-weekly to cut FX cost. Momentum has 14 trials already, so expect failure and treat any pass as suspect.
  - id: R-0002
    card: H-0008
    params: {window: 126}
    priority: 3
    source: researcher
    note: Untested liquidity family (diversifies the trial spread away from momentum/vol). Low prior; check capacity and turnover.
  - id: R-0003
    card: H-0003
    params: {window: 252}
    priority: 2
    source: researcher
    note: 52-week-high is untested; highly correlated with 12-1 momentum, so likely fails for the same reasons.
  - id: R-0004
    card: H-0008
    params: {window: 63}
    priority: 1
    source: researcher
    note: Shorter Amihud window, only if R-0002 shows any signal.

